<head>
    <title>AI Car Price Predictor</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function saveAnswer(choice) {
        // Retrieve existing answers or start a new array
        let currentAnswers = JSON.parse(localStorage.getItem('userAnswers')) || [];
        
        // Add the new choice
        currentAnswers.push(choice);
        
        // Save back to localStorage
        localStorage.setItem('userAnswers', JSON.stringify(currentAnswers));
        
        console.log("Updated Answers:", currentAnswers);
  }
    </script>
</head>
